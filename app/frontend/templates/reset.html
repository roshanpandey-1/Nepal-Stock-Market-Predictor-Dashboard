{% extends "base.html" %}
{% block title %}Choose a new password · NEPSE Intelligence{% endblock %}
{% block content %}
<div class="auth-card">
  <span class="brand-mark" aria-hidden="true">N</span>
  <h1>Choose a new password</h1>
  {% include "_flash.html" %}
  <form method="post" action="{{ url_for('acct.reset_password', token=token) }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span>New password <em>(8+ characters, with a capital letter, a number and a special character)</em></span>
      <input type="password" name="password" required minlength="8" autocomplete="new-password" autofocus {% if errors.password %}class="invalid" aria-invalid="true"{% endif %}>
      {% if errors.password %}<small class="field-error">{{ errors.password }}</small>{% endif %}
    </label>
    <label class="field"><span>Confirm new password</span>
      <input type="password" name="confirm" required minlength="8" autocomplete="new-password" {% if errors.confirm %}class="invalid" aria-invalid="true"{% endif %}>
      <small class="field-error" data-confirm-msg {% if not errors.confirm %}hidden{% endif %}>{{ errors.confirm or "Passwords don't match." }}</small>
    </label>
    <button class="btn-primary-nepse" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
