<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NEPSE Intelligence{% endblock %}</title>
  <script>
    // Set the theme attribute before first paint, so switching pages (or a
    // hard refresh) never flashes the wrong theme while the stylesheet and
    // rest of the page load. Falls back to "system" the first time a
    // visitor arrives (i.e. it follows their OS setting until they pick one
    // explicitly via the toggle in the navbar).
    (function () {
      try {
        var theme = localStorage.getItem("nepse-theme") || "system";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "system");
      }
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
</head>
<body>
  {% if ticker_strip %}
  <div class="ticker-strip-wrap">
    <div class="ticker-strip">
      {% for t in ticker_strip + ticker_strip %}
      <a class="ticker-item" href="{{ url_for('main.stock_detail', ticker=t.ticker) }}">
        <span class="sym">{{ t.ticker }}</span>
        <span>Rs {{ t.close }}</span>
        <span class="chg {{ 'pos' if t.change_pct >= 0 else 'neg' }}">
          {{ '+' if t.change_pct >= 0 else '' }}{{ t.change_pct }}%
        </span>
      </a>
      {% endfor %}
    </div>
  </div>
  {% endif %}

  <nav class="navbar navbar-expand-lg">
    <div class="container-main d-flex w-100">
      <a class="navbar-brand" href="{{ url_for('main.dashboard') }}">🇳🇵 NEPSE Intelligence</a>

      <form class="nav-search" id="nav-search-form" autocomplete="off" role="search">
        <input type="text" id="nav-search-input"
               placeholder="Search symbol or company…" aria-label="Search ticker"
               autocomplete="off" role="combobox" aria-expanded="false"
               aria-controls="nav-search-results">
        <div class="nav-search-results" id="nav-search-results" role="listbox"></div>
      </form>

      <div class="ms-auto d-flex align-items-center gap-3">
        <a class="nav-link {% if request.endpoint == 'main.dashboard' %}active{% endif %}" href="{{ url_for('main.dashboard') }}">Dashboard</a>
        <a class="nav-link {% if request.endpoint == 'main.backtest' %}active{% endif %}" href="{{ url_for('main.backtest') }}">Backtest</a>
        <a class="nav-link {% if request.endpoint == 'main.sentiment' %}active{% endif %}" href="{{ url_for('main.sentiment') }}">Sentiment</a>
        <div class="theme-toggle" id="theme-toggle" role="group" aria-label="Theme">
          <button type="button" data-theme-choice="light" title="Light">☀</button>
          <button type="button" data-theme-choice="dark" title="Dark">☾</button>
          <button type="button" data-theme-choice="system" title="System">◐</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-main">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
