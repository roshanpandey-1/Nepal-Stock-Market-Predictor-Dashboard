services:
  - type: web
    name: nepse-intelligence
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements-web.txt"
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: DATA_DIR
        value: deploy_data
      - key: PYTHON_VERSION
        value: 3.11.9
      # Accounts. SECRET_KEY signs login sessions; DATABASE_URL is your Neon/Supabase
      # Postgres connection string. Render's free disk is wiped on every deploy, so
      # without DATABASE_URL accounts would vanish. Set the sync:false values in the
      # Render dashboard (Environment tab).
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Password-reset emails (Brevo, sent over HTTPS). MAIL_SENDER must be an
      # address you verified in Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_SENDER
        sync: false
