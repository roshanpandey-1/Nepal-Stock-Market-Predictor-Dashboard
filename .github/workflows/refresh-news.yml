name: Refresh news sentiment

# Scrapes the latest Sharesansar headlines, scores only the NEW ones with
# FinBERT, merges them into deploy_data/news/, and pushes to main so Render
# redeploys with fresh sentiment. Run it by hand from the Actions tab with
# "Run workflow" to test.
on:
  schedule:
    - cron: "30 11 * * *"   # daily, 11:30 UTC = 17:15 Nepal time (after market close)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU-only torch keeps this ~10x smaller)
        run: |
          pip install torch==2.1.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.35.2 selenium==4.15.0 beautifulsoup4 lxml \
                      pandas==2.1.3 numpy==1.26.2 loguru

      - name: Cache FinBERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-prosusai-v1

      # google-chrome is preinstalled on ubuntu-latest; Selenium Manager
      # fetches the matching chromedriver on its own.
      - name: Scrape + score new headlines
        env:
          TRANSFORMERS_NO_TF: "1"
        run: python src/nlp/sentiment_analyzer.py --pages 10 --output-dir deploy_data/news

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- deploy_data/news; then
            echo "No new headlines -- nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy_data/news
          git commit -m "chore(news): refresh sentiment data"
          git pull --rebase origin main
          git push origin HEAD:main
