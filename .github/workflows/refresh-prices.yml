name: Refresh daily prices

# Pulls each ticker's new daily rows from Sharesansar, recomputes features, and
# updates (a) the trimmed deploy_data/processed files the live site serves and
# (b) the full-history bundle on the `data-latest` release that the weekly
# forecast / retrain job reads.
#
# ONE-TIME SETUP: create a release tagged `data-latest` with data-snapshot.tar.gz
# attached (made by `python scripts/data_snapshot.py pack`). See that script.
on:
  schedule:
    - cron: "30 10 * * 1-5"   # Mon-Fri (NEPSE trading days), 10:30 UTC = 16:15 Nepal, after close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install selenium==4.15.0 beautifulsoup4 lxml pandas==2.1.3 numpy==1.26.2 ta==0.11.0 loguru
          pip install torch==2.1.1 --index-url https://download.pytorch.org/whl/cpu
          pip install scikit-learn==1.3.2 xgboost==2.0.2

      - name: Download full price history
        run: |
          gh release download data-latest -p data-snapshot.tar.gz --clobber
          python scripts/data_snapshot.py unpack

      - name: Fetch new daily rows (Sharesansar)
        run: python scripts/fetch_incremental_data.py

      # A blocked scrape looks like "no new rows", so fail loudly if the data
      # is stale (limit allows for the long Dashain/Tihar market closures).
      - name: Freshness check
        run: python scripts/data_snapshot.py check --max-age-days 12

      - name: Rebuild trimmed deploy_data/processed
        run: python scripts/build_deploy_snapshot.py --only processed

      # "Why this signal?" explanations for the new day (the site only reads this file)
      - name: Rebuild signal explanations
        run: python scripts/build_explanations.py --data-dir deploy_data

      # Daily market report (deploy_data/reports). The NEPSE client is only used to
      # record the official index close; NEPSE often blocks non-Nepal servers, so
      # that part is best effort and the report says when the index is missing.
      - name: Install NEPSE client (optional, for the official index)
        continue-on-error: true
        run: pip install "nepse @ git+https://github.com/basic-bgnr/NepseUnofficialApi"

      # Headlines + links from ShareSansar (announcements and news), never article text.
      - name: Collect announcements and news headlines
        continue-on-error: true
        run: |
          pip install requests==2.31.0
          python scripts/fetch_announcements.py --data-dir deploy_data --days 5

      # continue-on-error: a report problem must never stop the new prices being saved.
      - name: Build daily market report
        continue-on-error: true
        run: python scripts/build_daily_report.py --data-dir deploy_data --capture-index

      - name: Upload updated full history
        run: |
          python scripts/data_snapshot.py pack
          gh release upload data-latest data-snapshot.tar.gz --clobber

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- deploy_data/processed deploy_data/models/explanations.json && [ -z "$(git status --porcelain deploy_data/reports deploy_data/external/announcements.json)" ]; then
            echo "No new prices -- nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy_data/processed deploy_data/models/explanations.json deploy_data/reports
          if [ -f deploy_data/external/announcements.json ]; then git add deploy_data/external/announcements.json; fi
          git commit -m "chore(data): refresh daily prices"
          git pull --rebase origin main
          git push origin HEAD:main
