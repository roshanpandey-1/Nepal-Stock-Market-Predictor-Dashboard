name: Class-weight experiment (no deploy)

# Manual only. Also backtests the class-weighted candidates and compares them with the deployed models' backtest.
# Manual only. Trains every sector WITH class weighting and compares it with the
# deployed model on the same holdout, including the always-Hold baseline and
# Buy/Sell recall. Nothing is committed and no deployed model is changed.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sectors: ${{ steps.plan.outputs.sectors }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: plan
        run: |
          pip install numpy==1.26.2 pandas==2.1.3 scikit-learn==1.3.2 loguru >/dev/null
          echo "sectors=$(python scripts/retrain_with_gate.py plan)" >> "$GITHUB_OUTPUT"

  train:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.sectors) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch==2.1.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.2 pandas==2.1.3 scikit-learn==1.3.2 xgboost==2.0.2 loguru
      - name: Download full price history
        run: |
          gh release download data-latest -p data-snapshot.tar.gz --clobber
          python scripts/data_snapshot.py unpack
      - name: Train class-weighted candidate, compare with current
        run: python scripts/retrain_with_gate.py run --sector "${{ matrix.sector }}" --out-dir result --class-weight --keep-files
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cw-${{ matrix.stem }}
          path: |
            result/decision.json
            result/files
          if-no-files-found: ignore

  report:
    needs: train
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: cw-*
          path: artifacts
      - name: Comparison table
        run: |
          pip install pandas==2.1.3 numpy==1.26.2 scikit-learn==1.3.2 loguru >/dev/null
          python scripts/retrain_with_gate.py report --artifacts artifacts | tee -a "$GITHUB_STEP_SUMMARY"

  backtest:
    needs: train
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch==2.1.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.2 pandas==2.1.3 scikit-learn==1.3.2 xgboost==2.0.2 loguru tabulate
      - name: Download full price history
        run: |
          gh release download data-latest -p data-snapshot.tar.gz --clobber
          python scripts/data_snapshot.py unpack
      - uses: actions/download-artifact@v4
        with:
          pattern: cw-*
          path: artifacts
      - name: Backtest the class-weighted candidates
        run: |
          mkdir -p data/models
          cp deploy_data/models/*_oos* deploy_data/models/*_split_date.txt data/models/ 2>/dev/null || true
          for d in artifacts/*/files; do cp "$d"/* data/models/; done
          python scripts/run_backtests_oos.py
          cp data/models/backtest_summary_oos.csv cw_backtest.csv
      - name: Compare with deployed models
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          a = pd.read_csv("deploy_data/models/backtest_summary_oos.csv").set_index("sector")
          b = pd.read_csv("cw_backtest.csv").set_index("sector")
          cols = ["ml_return_pct", "bnh_return_pct", "sharpe_ratio", "max_drawdown_pct", "win_rate_pct", "num_trades"]
          t = a[cols].join(b[cols], lsuffix="_deployed", rsuffix="_cw")
          print("### Backtest: deployed vs class-weighted\n")
          print(t.reset_index().to_markdown(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-cw
          path: cw_backtest.csv
