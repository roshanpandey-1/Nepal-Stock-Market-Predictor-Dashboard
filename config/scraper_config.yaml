# Scraper Configuration

sources:
  sharesansar:
    base_url: "https://www.sharesansar.com"
    stock_url: "https://www.sharesansar.com/company/{ticker}"
    news_url: "https://www.sharesansar.com/category/latest"
    delay_seconds: 2

  merolagani:
    base_url: "https://merolagani.com"
    stock_url: "https://merolagani.com/CompanyDetail.aspx?comSymbol={ticker}"
    delay_seconds: 2

  onlinekhabar:
    base_url: "https://www.onlinekhabar.com"
    business_url: "https://www.onlinekhabar.com/content/business-news"
    delay_seconds: 1

headers:
  User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

data_storage:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  cache_dir: "data/cache"
  cache_expiry_hours: 24
