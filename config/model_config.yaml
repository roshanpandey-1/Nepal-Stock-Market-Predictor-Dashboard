# Model Configuration

forecasting:
  prophet:
    changepoint_prior_scale: 0.05
    seasonality_prior_scale: 10
    forecast_days: 7
  lstm:
    window_size: 30
    units: [64, 32]
    dropout: 0.2
    epochs: 50
    batch_size: 32

classification:
  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    scale_pos_weight: 1
  lightgbm:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    num_leaves: 31

labeling:
  buy_threshold: 0.01     # +1% next day return = BUY
  sell_threshold: -0.01   # -1% next day return = SELL
  # else = HOLD

target_stocks:
  - NABIL   # Nabil Bank
  - NICA    # NIC Asia Bank
  - NTC     # Nepal Telecom
  - HBL     # Himalayan Bank
  - UPPER   # Upper Tamakoshi
  - NIFRA   # Nepal Infrastructure
  - GBIME   # Global IME Bank
  - SCB     # Standard Chartered
  - EBL     # Everest Bank
  - ADBL    # Agriculture Development Bank
